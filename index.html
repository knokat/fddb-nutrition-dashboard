<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nutrition">
  <meta name="theme-color" content="#205781">
  <meta name="description" content="Katjas fddb Nutrition Dashboard">

  <title>Nutrition Dashboard</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --kcal: #205781;
      --protein: #006D77;
      --carbs: #4F959D;
      --fat: #7AB2B2;

      --dt-workout: #A42059;
      --dt-rest: #7AB2B2;
      --dt-friday: #205781;

      --warn-mid: #623c6d;
      --warn-high: #A42059;

      --bg: #f4f4f2;
      --card: #fff;
      --border-1: #e8e8e6;
      --border-2: #ececea;
      --border-3: #f0f0ee;
      --text-1: #1a1a1a;
      --text-2: #888;
      --text-3: #aaa;
      --text-4: #ccc;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-height: 56px;

      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      height: 100%;
      width: 100%;
      touch-action: manipulation;
    }

    input, button, textarea {
      font-family: var(--font);
      font-size: 16px;
    }

    /* ── App Container ── */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ── Screens ── */
    .screen {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
    }

    .today-screen {
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px);
    }

    /* ── Splash ── */
    .splash {
      display: flex; align-items: center; justify-content: center;
      height: 100dvh; background: var(--bg);
    }
    .splash-logo { width: 72px; height: 72px; border-radius: 16px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.95); } }

    /* ── Sticky Header ── */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      border-bottom: 0.5px solid var(--border-2);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .header-date {
      font-size: 15px;
      color: var(--text-2);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-nav-arrows {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-arrow {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-2);
      transition: background 0.15s;
    }
    .nav-arrow:active { background: var(--border-2); }
    .settings-gear { margin-left: 4px; }

    .kw-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      min-width: 48px;
      text-align: center;
    }

    /* ── Week Strip ── */
    .week-strip {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      margin-bottom: 12px;
    }

    .week-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 2px;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .week-day.selected { background: rgba(32, 87, 129, 0.06); }
    .week-day:active { background: var(--border-3); }

    .week-day-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-3);
      letter-spacing: 0.3px;
    }
    .week-day-label.today-label {
      color: var(--text-1);
      font-weight: 700;
    }

    /* ── Macro Bars ── */
    .macro-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .macro-bar {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .macro-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .macro-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .macro-values {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .macro-bar-track {
      height: 5px;
      background: var(--border-2);
      border-radius: 3px;
      overflow: hidden;
    }

    .macro-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease, background 0.3s ease;
    }

    /* ── Macro Distribution ── */
    .macro-distribution {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .macro-dist-dot { color: var(--text-4); }

    /* ── Screen Body ── */
    .screen-body {
      padding: 16px;
    }

    /* ── Day Notes ── */
    .day-notes {
      margin-bottom: 16px;
    }
    .day-notes-input {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-1);
      background: var(--card);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      resize: none;
      overflow-y: auto;
      line-height: 1.4;
    }
    .day-notes-input::placeholder { color: var(--text-3); }
    .day-notes-input:focus { outline: none; border-color: var(--kcal); }

    /* ── Segmented Picker ── */
    .seg-picker {
      display: flex;
      align-items: center;
      background: #dededa;
      border-radius: 12px;
      padding: 3px;
      position: relative;
      margin-bottom: 16px;
    }

    .seg-pill {
      position: absolute;
      top: 3px;
      height: calc(100% - 6px);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12), 0 0.5px 1.5px rgba(0,0,0,0.06);
      transition: left 0.25s ease, width 0.25s ease;
      z-index: 0;
    }

    .seg-item {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-1);
      cursor: pointer;
      position: relative;
      z-index: 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .seg-item.active { font-weight: 600; }

    .seg-divider {
      width: 1px;
      height: 18px;
      background: #bbb;
      flex-shrink: 0;
      z-index: 1;
      transition: opacity 0.2s;
    }
    .seg-divider.hidden { opacity: 0; }

    /* ── Meals List ── */
    .meals-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Meal/Slot Card ── */
    .meal-card {
      background: var(--card);
      border-radius: 14px;
      border: 0.5px solid var(--border-1);
      overflow: hidden;
    }

    .meal-card-header {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .meal-card-header:active { background: var(--border-3); }

    .meal-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #f5f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .meal-icon { font-size: 18px; }

    .meal-info { flex: 1; min-width: 0; }

    .meal-name {
      font-size: 14px;
      font-weight: 600;
    }

    .meal-macros-preview {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 2px;
      display: flex;
      gap: 4px;
      align-items: center;
      font-variant-numeric: tabular-nums;
    }

    .macro-dot { color: var(--text-4); }

    .meal-chevron {
      color: var(--text-3);
      flex-shrink: 0;
    }

    .meal-card-body {
      background: #fafaf8;
      border-top: 0.5px solid var(--border-2);
      padding: 10px 14px 12px;
    }

    .meal-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meal-item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      padding: 2px 0;
    }

    .item-left {
      display: flex;
      gap: 6px;
      align-items: baseline;
      min-width: 0;
      flex: 1;
    }

    .item-name {
      color: var(--text-1);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-right {
      display: flex;
      gap: 6px;
      align-items: baseline;
      flex-shrink: 0;
    }

    .item-kcal {
      font-variant-numeric: tabular-nums;
      color: var(--text-1);
      font-weight: 500;
      min-width: 28px;
      text-align: right;
    }

    .item-macros {
      color: var(--text-3);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Day Total ── */
    .day-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 14px 16px;
      background: var(--card);
      border-radius: 14px;
      border: 0.5px solid var(--border-1);
    }

    .day-total-label {
      font-size: 14px;
      font-weight: 700;
    }

    .day-total-macros {
      display: flex;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ── Leander Section ── */
    .leander-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-2);
    }

    .leander-header {
      margin-bottom: 10px;
    }

    .leander-title {
      font-size: 16px;
      font-weight: 700;
    }

    .leander-card {
      background: var(--card);
      border-radius: 14px;
      border: 0.5px solid var(--border-1);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .leander-meal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
    }

    .leander-meal-icon { font-size: 16px; }

    .leander-meal-label {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
    }

    .leander-expand {
      color: var(--text-3);
      font-size: 14px;
    }

    .leander-meal-content {
      padding: 0 14px 10px;
      cursor: pointer;
    }

    .leander-meal-text {
      font-size: 13px;
      color: var(--text-1);
    }

    .leander-meal-empty {
      font-size: 13px;
      font-style: italic;
      color: var(--text-3);
    }

    .leander-oats-items {
      padding: 6px 14px 10px;
      border-top: 0.5px solid var(--border-2);
    }

    .leander-oats-item {
      font-size: 13px;
      color: var(--text-2);
      padding: 2px 0;
    }

    /* ── Loading State ── */
    .loading-state {
      text-align: center;
      padding: 32px;
      color: var(--text-3);
      font-size: 14px;
    }

    /* ── Week Screen ── */
    .week-screen { padding: 0 16px 24px; }
    .week-header { padding: calc(var(--safe-top) + 12px) 0 12px; }
    .week-header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .week-nav { display: flex; align-items: center; justify-content: space-between; }
    .week-range { font-size: 14px; color: var(--text-2); font-weight: 500; }

    .week-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .summary-card {
      background: var(--card); border-radius: 14px; border: 0.5px solid var(--border-1);
      padding: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .summary-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .summary-values { display: flex; align-items: baseline; gap: 4px; }
    .summary-actual { font-size: 20px; font-weight: 700; }
    .summary-target { font-size: 13px; color: var(--text-3); }
    .summary-bar-track { height: 4px; background: var(--border-2); border-radius: 2px; overflow: hidden; }
    .summary-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    .summary-avg { font-size: 11px; color: var(--text-3); }

    /* Weekly Macro Distribution */
    .week-macro-dist {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .week-daily { background: var(--card); border-radius: 14px; border: 0.5px solid var(--border-1); padding: 14px; }
    .week-daily-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }

    .daily-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .daily-row.today-row { font-weight: 600; }
    .daily-label { display: flex; align-items: center; gap: 5px; width: 48px; flex-shrink: 0; }
    .dt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .daily-day { font-size: 12px; color: var(--text-2); }
    .today-row .daily-day { color: var(--text-1); font-weight: 700; }

    .daily-bar-container { flex: 1; display: flex; align-items: center; gap: 8px; }
    .daily-bar-track { flex: 1; height: 14px; background: var(--border-3); border-radius: 4px; position: relative; overflow: visible; }
    .daily-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .daily-target-line { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--text-3); border-radius: 1px; }
    .daily-kcal { font-size: 12px; font-weight: 600; color: var(--text-1); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

    .week-legend { display: flex; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 0.5px solid var(--border-2); flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-3); }
    .target-line-legend { width: 1.5px; height: 12px; background: var(--text-3); border-radius: 1px; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: var(--nav-height);
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      border-top: 0.5px solid var(--border-1);
      flex-shrink: 0;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-icon { color: var(--text-3); transition: color 0.15s; }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--text-3); transition: color 0.15s; }
    .nav-tab.active .nav-icon { color: var(--kcal); }
    .nav-tab.active .nav-label { color: var(--kcal); font-weight: 600; }

    /* ── Login Screen ── */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      background: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .login-icon-img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 12px; }

    .login-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
    }

    .login-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      border: 0.5px solid var(--border-1);
      border-radius: 12px;
      background: var(--card);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--kcal); }

    .login-error {
      font-size: 13px;
      color: var(--warn-high);
      margin-bottom: 12px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--kcal);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .login-btn:active { opacity: 0.85; }
    .login-btn.loading { opacity: 0.6; pointer-events: none; }

    /* ── Settings ── */
    .settings-screen { padding: 24px 16px; }
    .settings-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
    .settings-section { margin-bottom: 24px; }
    .settings-label { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; padding-left: 4px; }
    .settings-card { background: var(--card); border-radius: 14px; border: 0.5px solid var(--border-1); overflow: hidden; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 15px; }
    .settings-row + .settings-row { border-top: 0.5px solid var(--border-2); }
    .settings-row.clickable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .settings-row.clickable:active { background: var(--border-3); }
    .settings-row.danger { color: var(--warn-high); }
    .settings-value { color: var(--text-2); font-size: 14px; }
    .settings-arrow { color: var(--text-3); }
    .settings-version { text-align: center; color: var(--text-4); font-size: 12px; margin-top: 32px; }

    /* Import Section */
    .import-section { padding: 12px 16px 16px; border-top: 0.5px solid var(--border-2); }
    .import-file-area {
      width: 100%; padding: 24px 16px; border: 1.5px dashed var(--border-1); border-radius: 10px;
      background: var(--bg); cursor: pointer; text-align: center;
      transition: border-color 0.2s;
    }
    .import-file-area:active { border-color: var(--kcal); }
    .import-file-placeholder { font-size: 14px; color: var(--text-3); }
    .import-file-name { font-size: 14px; color: var(--kcal); font-weight: 600; }
    .import-actions { margin-top: 10px; display: flex; justify-content: flex-end; }
    .import-msg { margin-top: 10px; font-size: 13px; padding: 10px 12px; border-radius: 8px; }
    .import-msg.success { background: #e1f5ee; color: #085041; }
    .import-msg.error { background: #fde8e8; color: #a42059; }

    .sheet-btn {
      flex: none;
      padding: 10px 24px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .sheet-btn.save {
      background: var(--kcal);
      color: #fff;
    }
    .sheet-btn.disabled { opacity: 0.4; pointer-events: none; }
    .sheet-btn:active { opacity: 0.85; }

    /* Targets Section */
    .targets-section { padding: 12px 16px 16px; border-top: 0.5px solid var(--border-2); }

    .target-block {
      margin-bottom: 16px;
    }
    .target-block:last-of-type { margin-bottom: 10px; }

    .target-block-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .target-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .target-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .target-field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.3px;
    }

    .target-input {
      width: 100%;
      padding: 8px 10px;
      border: 0.5px solid var(--border-1);
      border-radius: 8px;
      font-size: 15px;
      background: var(--bg);
      outline: none;
      font-variant-numeric: tabular-nums;
    }
